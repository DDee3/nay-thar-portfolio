<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title | default(profile.name ~ ' — ' ~ profile.role) }}</title>
  <meta name="description" content="{{ meta_description | default(profile.pitch) }}" />
  <meta name="author" content="{{ profile.name }}" />

  <!-- Open Graph / Social Meta -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ page_title | default(profile.name ~ ' — ' ~ profile.role) }}" />
  <meta property="og:description" content="{{ meta_description | default(profile.pitch) }}" />
  <meta property="og:url" content="{{ profile.site_url }}{{ request.path }}" />
  <meta property="og:image" content="{{ profile.site_url }}/static/img/prophet-forecast.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Prevent theme flash before paint -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- Tailwind CSS via CDN + Custom Stylesheet -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}" />
</head>
<body class="min-h-screen flex flex-col bg-zinc-50 text-zinc-900 dark:bg-[#09090b] dark:text-zinc-100 font-sans antialiased selection:bg-emerald-500/20 selection:text-emerald-400 transition-colors duration-200">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:rounded-md focus:bg-emerald-500 focus:text-zinc-950 focus:font-medium">
    Skip to content
  </a>

  <!-- Top Navigation -->
  <header class="sticky top-0 z-40 border-b border-zinc-200/80 dark:border-zinc-800/80 bg-zinc-50/85 dark:bg-[#09090b]/85 backdrop-blur-md">
    <div class="max-w-4xl mx-auto px-5 sm:px-8 h-16 flex items-center justify-between">
      <a href="{{ url_for('portfolio.index') }}" class="flex items-center focus:outline-none">
        <span class="font-semibold tracking-tight text-sm sm:text-base text-zinc-900 dark:text-zinc-100">
          {{ profile.name }}
        </span>
      </a>

      <nav aria-label="Main navigation" class="flex items-center gap-1 sm:gap-2">
        <a href="{{ url_for('portfolio.projects') }}"
           class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors {% if request.path.startswith('/projects') %}text-zinc-900 dark:text-white bg-zinc-200/70 dark:bg-zinc-800/80{% else %}text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100{% endif %}">
          Projects
        </a>
        <a href="{{ url_for('portfolio.about') }}"
           class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors {% if request.path == '/about' %}text-zinc-900 dark:text-white bg-zinc-200/70 dark:bg-zinc-800/80{% else %}text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100{% endif %}">
          About
        </a>
        <a href="{{ url_for('portfolio.contact') }}"
           class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors {% if request.path == '/contact' %}text-zinc-900 dark:text-white bg-zinc-200/70 dark:bg-zinc-800/80{% else %}text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100{% endif %}">
          Contact
        </a>

        <button id="theme-toggle" type="button" aria-label="Toggle color theme"
                class="ml-1 p-2 rounded-md border border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-900 transition-colors">
          <!-- Sun icon (shown in dark mode) -->
          <svg id="icon-sun" class="w-4 h-4 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5M12 19.5V21M4.22 4.22l1.06 1.06M18.72 18.72l1.06 1.06M3 12h1.5M19.5 12H21M4.22 19.78l1.06-1.06M18.72 5.28l1.06-1.06M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
          </svg>
          <!-- Moon icon (shown in light mode) -->
          <svg id="icon-moon" class="w-4 h-4 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="flex-1 max-w-4xl w-full mx-auto px-5 sm:px-8 py-12 sm:py-20 fade-up">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-zinc-200/80 dark:border-zinc-800/80 py-8 mt-16">
    <div class="max-w-4xl mx-auto px-5 sm:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-zinc-500 dark:text-zinc-500">
      <p>{{ profile.name }} · {{ profile.role }}</p>
      <div class="flex items-center gap-5">
        <a href="mailto:{{ profile.email }}" class="hover:text-zinc-900 dark:hover:text-zinc-200 transition-colors">Email</a>
        <a href="{{ profile.github }}" target="_blank" rel="noopener noreferrer" class="hover:text-zinc-900 dark:hover:text-zinc-200 transition-colors">GitHub</a>
        <a href="{{ profile.linkedin }}" target="_blank" rel="noopener noreferrer" class="hover:text-zinc-900 dark:hover:text-zinc-200 transition-colors">LinkedIn</a>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var isDark = root.classList.toggle('dark');
        try {
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
        } catch (e) {}
      });
    })();
  </script>
</body>
</html>
