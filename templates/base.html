<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title | default(profile.name ~ ' — ' ~ profile.role) }}</title>
  <meta name="description" content="{{ meta_description | default(profile.pitch) }}" />
  <meta name="author" content="{{ profile.name }}" />
  <meta name="theme-color" content="#F5F5F7" />

  <!-- Open Graph / Social Meta -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ page_title | default(profile.name ~ ' — ' ~ profile.role) }}" />
  <meta property="og:description" content="{{ meta_description | default(profile.pitch) }}" />
  <meta property="og:url" content="{{ profile.site_url }}{{ request.path }}" />
  <meta property="og:image" content="{{ profile.site_url }}/static/img/prophet-forecast.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Clean, Crisp Sans-Serif Font (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN + Signature Apple Light Palette -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            apple: {
              bg: '#F5F5F7',
              surface: '#FFFFFF',
              alt: '#EBEBED',
              ink: '#1D1D1F',
              muted: '#6E6E73',
              blue: '#0066CC',
              rule: '#D2D2D7'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}" />
</head>
<body class="min-h-screen flex flex-col bg-[#F5F5F7] text-[#1D1D1F] font-sans antialiased overflow-x-hidden">
  <!-- Skip Navigation Link -->
  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-[#1D1D1F] focus:text-[#FFFFFF] focus:font-medium focus:text-sm">
    Skip to content
  </a>

  <!-- Apple-Inspired Minimalist Top Navigation -->
  <header class="apple-nav">
    <div class="max-w-6xl mx-auto px-6 sm:px-10 h-16 flex items-center justify-between gap-6">
      <a href="{{ url_for('portfolio.index') }}" class="text-base font-semibold tracking-[-0.025em] text-[#1D1D1F] hover:text-[#0066CC] transition-colors">
        {{ profile.name }}
      </a>

      <nav aria-label="Main navigation" class="flex items-center gap-6 sm:gap-9 text-sm">
        <a href="{{ url_for('portfolio.projects') }}"
           class="font-medium transition-colors {% if request.path.startswith('/projects') %}text-[#1D1D1F]{% else %}text-[#6E6E73] hover:text-[#0066CC]{% endif %}">
          Projects
        </a>
        <a href="{{ url_for('portfolio.about') }}"
           class="font-medium transition-colors {% if request.path == '/about' %}text-[#1D1D1F]{% else %}text-[#6E6E73] hover:text-[#0066CC]{% endif %}">
          About
        </a>
        <a href="{{ url_for('portfolio.contact') }}"
           class="font-medium transition-colors {% if request.path == '/contact' %}text-[#1D1D1F]{% else %}text-[#6E6E73] hover:text-[#0066CC]{% endif %}">
          Contact
        </a>
        <a href="mailto:{{ profile.email }}" class="hidden sm:inline-flex apple-link text-sm">
          <span>Email</span>
          <span aria-hidden="true" class="arrow-shift">↗</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Lenis Smooth Scroll Wrapper -->
  <div id="lenis-wrapper" class="relative z-10 flex-1 flex flex-col">
    <div id="lenis-content" class="flex-1 flex flex-col">
      <main id="main-content" class="flex-1 max-w-6xl w-full mx-auto px-6 sm:px-10">
        {% block content %}{% endblock %}
      </main>

      <!-- Apple-Inspired Minimalist Footer -->
      <footer class="border-t border-[#D2D2D7] bg-[#FFFFFF] py-20 sm:py-24 mt-32">
        <div class="max-w-6xl mx-auto px-6 sm:px-10 flex flex-col md:flex-row items-start md:items-end justify-between gap-10">
          <div class="space-y-2">
            <p class="text-2xl sm:text-3xl font-bold tracking-[-0.04em] text-[#1D1D1F]">
              {{ profile.name }}
            </p>
            <p class="text-sm text-[#6E6E73]">
              {{ profile.role }} · {{ profile.education }}
            </p>
          </div>

          <div class="flex flex-wrap items-center gap-8 text-sm">
            <a href="mailto:{{ profile.email }}" class="apple-link">
              <span>{{ profile.email }}</span>
            </a>
            <a href="{{ profile.github }}" target="_blank" rel="noopener noreferrer" class="apple-muted-link">
              <span>GitHub</span>
              <span aria-hidden="true" class="arrow-shift">↗</span>
            </a>
            <a href="{{ profile.linkedin }}" target="_blank" rel="noopener noreferrer" class="apple-muted-link">
              <span>LinkedIn</span>
              <span aria-hidden="true" class="arrow-shift">↗</span>
            </a>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <!-- 3D (Three.js), Smooth Scroll (Lenis) & Framer Motion DOM Runtime -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js" defer></script>
  <script src="{{ url_for('static', filename='js/portfolio-motion.js') }}" defer></script>
</body>
</html>
