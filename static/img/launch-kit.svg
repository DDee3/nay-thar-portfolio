<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="lkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="heroTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
    <radialGradient id="orangeGlow" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#FF5A00" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#FF5A00" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="spatialGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.035" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#lkBg)" />
  <rect width="800" height="450" fill="url(#spatialGrid)" />
  <rect width="800" height="450" fill="url(#orangeGlow)" />

  <!-- Top Navbar -->
  <rect x="0" y="0" width="800" height="48" fill="#000000" fill-opacity="0.85" />
  <line x1="0" y1="48" x2="800" y2="48" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Brand Logo -->
  <g transform="translate(36, 12)">
    <rect width="24" height="24" fill="#09090b" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
    <polyline points="7,15 11,11 7,7" fill="none" stroke="#FF5A00" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="12" y1="16" x2="17" y2="16" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" />
    <text x="34" y="16" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="-0.03em">LAUNCHKIT</text>
    <text x="114" y="16" fill="#FF5A00" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.12em">// SPATIAL.01</text>
  </g>

  <!-- Navbar Links & CTA -->
  <g transform="translate(330, 28)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa" letter-spacing="0.1em">
    <text x="0" y="0">[ FEATURES ]</text>
    <text x="90" y="0">[ PRICING ]</text>
    <text x="175" y="0">[ ARCHITECTURE ]</text>
  </g>
  <g transform="translate(686, 11)">
    <rect width="78" height="26" fill="#FF5A00" />
    <text x="39" y="16" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" text-anchor="middle" letter-spacing="0.08em">DEPLOY ↗</text>
  </g>

  <!-- Hero Section -->
  <g transform="translate(400, 92)" text-anchor="middle">
    <!-- Kicker -->
    <line x1="-130" y1="-4" x2="-100" y2="-4" stroke="#FF5A00" stroke-width="1.2" />
    <text x="0" y="0" fill="#FF5A00" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="0.26em">AUTONOMOUS REVENUE ENGINE</text>
    <line x1="100" y1="-4" x2="130" y2="-4" stroke="#FF5A00" stroke-width="1.2" />

    <!-- Headline -->
    <text x="0" y="46" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.04em">ENGINEERED</text>
    <text x="0" y="88" fill="url(#heroTextGrad)" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.04em">TO MONETIZE.</text>

    <!-- Subtitle -->
    <text x="0" y="114" fill="#a1a1aa" font-family="Inter, system-ui, sans-serif" font-size="11.5">
      Hardened Supabase SSR token lifecycle, idempotent Stripe webhook sync, and strict TypeScript.
    </text>

    <!-- Hero CTAs -->
    <g transform="translate(-148, 130)">
      <rect width="140" height="34" fill="#FF5A00" />
      <text x="70" y="21" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.08em">ACQUIRE LICENSE ↗</text>
    </g>
    <g transform="translate(8, 130)">
      <rect width="140" height="34" fill="#000000" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" />
      <text x="70" y="21" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.08em">LAUNCH CONSOLE</text>
    </g>
  </g>

  <!-- Bottom Split: System Telemetry & Webhook Pipeline -->
  <!-- Card 1: System Telemetry Matrix -->
  <g transform="translate(36, 286)">
    <rect width="430" height="134" fill="#09090b" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    
    <!-- Telemetry Header -->
    <text x="18" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.08em">SYSTEM TELEMETRY</text>
    <text x="142" y="26" fill="#52525b" font-family="'JetBrains Mono', monospace" font-size="10">//</text>
    <text x="162" y="26" fill="#FF5A00" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">KERNEL: SECURE</text>
    <text x="412" y="26" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="end">ST_LATENCY: <tspan fill="#ffffff" font-weight="700">14ms</tspan></text>
    
    <line x1="18" y1="38" x2="412" y2="38" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

    <!-- 4 Spec Columns -->
    <g transform="translate(18, 58)" font-family="'JetBrains Mono', monospace">
      <!-- Col 1 -->
      <rect x="0" y="0" width="92" height="56" fill="#000000" stroke="#ffffff" stroke-opacity="0.07" />
      <text x="10" y="20" fill="#71717a" font-size="8.5">POSTGRES RLS</text>
      <text x="10" y="40" fill="#ffffff" font-size="10.5" font-weight="700">ENFORCED</text>

      <!-- Col 2 -->
      <rect x="100" y="0" width="96" height="56" fill="#000000" stroke="#ffffff" stroke-opacity="0.07" />
      <text x="110" y="20" fill="#71717a" font-size="8.5">WEBHOOK PIPE</text>
      <text x="110" y="40" fill="#FF5A00" font-size="10.5" font-weight="700">IDEMPOTENT</text>

      <!-- Col 3 -->
      <rect x="204" y="0" width="92" height="56" fill="#000000" stroke="#ffffff" stroke-opacity="0.07" />
      <text x="214" y="20" fill="#71717a" font-size="8.5">SESSION GUARD</text>
      <text x="214" y="40" fill="#ffffff" font-size="10.5" font-weight="700">EDGE SSR</text>

      <!-- Col 4 -->
      <rect x="304" y="0" width="90" height="56" fill="#000000" stroke="#ffffff" stroke-opacity="0.07" />
      <text x="314" y="20" fill="#71717a" font-size="8.5">TYPE RIGOR</text>
      <text x="314" y="40" fill="#ffffff" font-size="10.5" font-weight="700">STRICT TS</text>
    </g>
  </g>

  <!-- Card 2: MOD_01 // WEBHOOK_ENGINE Stream -->
  <g transform="translate(482, 286)">
    <rect width="282" height="134" fill="#09090b" fill-opacity="0.92" stroke="#FF5A00" stroke-opacity="0.45" stroke-width="1" />
    <text x="16" y="26" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="0.08em">EVENT STREAM // ACTIVE</text>
    <text x="266" y="26" fill="#FF5A00" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="end">200 OK</text>
    <line x1="16" y1="38" x2="266" y2="38" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

    <g transform="translate(16, 58)" font-family="'JetBrains Mono', monospace" font-size="9.5">
      <text x="0" y="0" fill="#d4d4d8"><tspan fill="#FF5A00">&gt;</tspan> stripe.webhooks.constructEvent()</text>
      <text x="0" y="20" fill="#a1a1aa"><tspan fill="#ffffff">✓</tspan> [Verified] subscription.updated</text>
      <text x="0" y="40" fill="#a1a1aa"><tspan fill="#ffffff">✓</tspan> [Profiles] status =&gt; 'active'</text>
      <text x="0" y="60" fill="#d4d4d8"><tspan fill="#FF5A00">✓</tspan> [Revalidate] /dashboard (8ms)</text>
    </g>
  </g>
</svg>

