<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b10" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>

    <!-- Spray Button Radial Gradient matching Spray.html -->
    <radialGradient id="sprayBtnGrad" cx="32%" cy="26%" r="70%">
      <stop offset="0%" stop-color="#6a97ff" />
      <stop offset="58%" stop-color="#2f6bff" />
      <stop offset="100%" stop-color="#2149bd" />
    </radialGradient>

    <!-- Button Glow -->
    <filter id="btnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#2f6bff" flood-opacity="0.45" />
    </filter>

    <!-- Phone Card Shadow -->
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Ambient Light Effects -->
  <circle cx="400" cy="225" r="220" fill="#2f6bff" opacity="0.08" filter="blur(60px)" />
  <circle cx="200" cy="100" r="140" fill="#10b981" opacity="0.05" filter="blur(50px)" />

  <!-- Mobile Device Mockup Frame (Centered) -->
  <g transform="translate(260, 20)" filter="url(#phoneShadow)">
    <!-- Phone Outer Body -->
    <rect width="280" height="410" rx="36" fill="#0e1116" stroke="#242a34" stroke-width="2.5" />

    <!-- Speaker Notch -->
    <rect x="105" y="12" width="70" height="5" rx="2.5" fill="#1b212b" />

    <!-- App Header -->
    <g transform="translate(24, 38)">
      <text x="116" y="20" fill="#eef1f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="-0.02em" text-anchor="middle">
        Spray Log
      </text>
      <text x="116" y="36" fill="#98a2b3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" text-anchor="middle">
        Tap whenever you spray. LocalStorage active.
      </text>
    </g>

    <!-- The Big Spray Circular Button -->
    <g transform="translate(140, 160)">
      <!-- Outer Pulse Ring -->
      <circle cx="0" cy="0" r="66" fill="none" stroke="#4b82ff" stroke-width="2" opacity="0.3" stroke-dasharray="4,4" />
      
      <!-- Main Action Button -->
      <circle cx="0" cy="0" r="58" fill="url(#sprayBtnGrad)" filter="url(#btnGlow)" />
      
      <!-- Button Text -->
      <text x="0" y="-3" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="0.05em" text-anchor="middle">
        SPRAY
      </text>
      <text x="0" y="15" fill="#dbeafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" text-anchor="middle">
        Tap to record
      </text>
    </g>

    <!-- Last Spray Status -->
    <g transform="translate(140, 246)">
      <text x="0" y="0" fill="#98a2b3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">
        Last: <tspan fill="#eef1f6" font-weight="600">Today at 2:15 PM</tspan>
      </text>
    </g>

    <!-- History Card Container -->
    <g transform="translate(20, 262)">
      <rect width="240" height="126" rx="14" fill="#171b22" stroke="#242a34" stroke-width="1" />

      <!-- History Header -->
      <text x="14" y="20" fill="#98a2b3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.08em">
        RECENT HISTORY
      </text>
      <text x="226" y="20" fill="#4b82ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" text-anchor="end">
        Export CSV
      </text>

      <!-- Divider line -->
      <line x1="0" y1="28" x2="240" y2="28" stroke="#242a34" stroke-width="1" />

      <!-- Row 1 -->
      <g transform="translate(14, 38)">
        <text x="0" y="14" fill="#eef1f6" font-family="monospace" font-size="12" font-weight="700">02:15 PM</text>
        <text x="0" y="25" fill="#98a2b3" font-family="sans-serif" font-size="8.5">Today • Dose #2</text>
        <circle cx="218" cy="17" r="4" fill="#10b981" />
      </g>

      <!-- Row Divider -->
      <line x1="14" y1="71" x2="226" y2="71" stroke="#202530" stroke-width="1" />

      <!-- Row 2 -->
      <g transform="translate(14, 78)">
        <text x="0" y="14" fill="#eef1f6" font-family="monospace" font-size="12" font-weight="700">10:30 AM</text>
        <text x="0" y="25" fill="#98a2b3" font-family="sans-serif" font-size="8.5">Today • Dose #1</text>
        <circle cx="218" cy="17" r="4" fill="#10b981" />
      </g>
    </g>
  </g>

  <!-- Left Side Badges / Feature Highlights -->
  <g transform="translate(48, 140)">
    <rect width="170" height="42" rx="8" fill="#111520" stroke="#202738" stroke-width="1" />
    <text x="14" y="18" fill="#4b82ff" font-family="monospace" font-size="10" font-weight="700">ZERO DEPENDENCIES</text>
    <text x="14" y="32" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Single-file static HTML/JS</text>

    <g transform="translate(0, 56)">
      <rect width="170" height="42" rx="8" fill="#111520" stroke="#202738" stroke-width="1" />
      <text x="14" y="18" fill="#10b981" font-family="monospace" font-size="10" font-weight="700">HAPTIC FEEDBACK</text>
      <text x="14" y="32" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Web Vibration API active</text>
    </g>

    <g transform="translate(0, 112)">
      <rect width="170" height="42" rx="8" fill="#111520" stroke="#202738" stroke-width="1" />
      <text x="14" y="18" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">LOCAL PRIVACY</text>
      <text x="14" y="32" fill="#94a3b8" font-family="sans-serif" font-size="9.5">100% Client-side LocalStorage</text>
    </g>
  </g>

  <!-- Right Side Summary Box -->
  <g transform="translate(580, 160)">
    <rect width="170" height="130" rx="10" fill="#111520" stroke="#202738" stroke-width="1" />
    <text x="16" y="26" fill="#eef1f6" font-family="sans-serif" font-size="12" font-weight="600">Quick Specs</text>
    
    <text x="16" y="52" fill="#64748b" font-family="sans-serif" font-size="10">Target Device</text>
    <text x="16" y="66" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="500">Mobile Safari &amp; Chrome</text>

    <text x="16" y="90" fill="#64748b" font-family="sans-serif" font-size="10">Storage</text>
    <text x="16" y="104" fill="#cbd5e1" font-family="monospace" font-size="11" font-weight="500">localStorage (JSON)</text>
  </g>
</svg>

